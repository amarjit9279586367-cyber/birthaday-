<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Celebration</title>
    <!-- Confetti Library for Fireworks -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* बेसिक सेटअप और सॉफ्ट थीम */
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            height: 100vh;
            overflow-x: hidden;
            user-select: none;
            color: #333;
        }

        /* हर टैप पर उड़ने वाले इमोजी का एनीमेशन */
        .tap-emoji {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* स्पैम बटन वाले इमोजी का एनीमेशन */
        .spam-emoji {
            position: fixed;
            font-size: 28px;
            pointer-events: none;
            animation: fallDown 2s linear forwards;
            z-index: 9999;
        }
        @keyframes fallDown {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* स्क्रीन्स को सेंटर करने के लिए */
        .fullscreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }

        /* 1. कीपैड स्क्रीन */
        #keypad-screen {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.5);
        }
        #pin-display {
            font-size: 30px; letter-spacing: 15px; color: #333;
            margin-bottom: 25px; height: 40px; border-bottom: 2px solid #ccc;
            display: flex; justify-content: center; align-items: center;
        }
        .key-row { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 15px; }
        .key {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.7); font-size: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer;
        }
        .key:active { transform: scale(0.9); background: #ddd; }

        /* 2. लोडिंग स्क्रीन */
        #loading-screen { display: none; }
        .heart {
            font-size: 80px; animation: heartbeat 1s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 15px rgba(255,0,0,0.4));
        }
        @keyframes heartbeat { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }
        .loading-text { margin-top: 15px; font-size: 22px; letter-spacing: 3px; animation: pulse 1s infinite alternate; }
        @keyframes pulse { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        /* 3. केक स्क्रीन */
        #cake-screen { display: none; cursor: pointer; }
        .cake-emoji { font-size: 100px; animation: floatCake 3s ease-in-out infinite; }
        @keyframes floatCake { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .tap-to-cut { margin-top: 20px; font-size: 20px; color: #ff6b81; font-weight: bold; }

        /* 4. मेन वेबसाइट (स्क्रॉल वाली) */
        #main-website {
            display: none; width: 100%; height: 100vh; overflow-y: auto; padding: 20px; box-sizing: border-box; text-align: center;
        }
        .album-photo {
            width: 80%; max-width: 300px; border-radius: 15px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.1); margin: 20px auto;
            border: 5px solid white; transform: rotate(-2deg);
        }
        .shayari-box {
            background: rgba(255,255,255,0.6); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 15px; margin: 20px auto; max-width: 400px; font-size: 18px; line-height: 1.6;
        }
        .action-btn {
            background: #ff4757; color: white; border: none; padding: 15px 30px;
            font-size: 18px; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(255,71,87,0.3);
            margin: 10px; transition: transform 0.2s;
        }
        .action-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <!-- बैकग्राउंड म्यूजिक (लूप के साथ) -->
    <audio id="bg-music" src="music/song.mp3" loop></audio>

    <!-- Phase 1: कीपैड -->
    <div id="keypad-screen" class="fullscreen">
        <h3 style="margin-top:0; color:#555;">Unlock Masterpiece</h3>
        <div id="pin-display"></div>
        <div class="key-row">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>
        </div>
        <div class="key-row">
            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>
        </div>
        <div class="key-row">
            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('9')">9</button>
        </div>
        <div class="key-row">
            <button class="key" onclick="clearPin()" style="color:#ff4757; font-weight:bold;">C</button>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key" onclick="checkPin()" style="color:#2ed573; font-weight:bold;">OK</button>
        </div>
    </div>

    <!-- Phase 2: लोडिंग (धड़कता दिल) -->
    <div id="loading-screen" class="fullscreen">
        <div class="heart">❤️</div>
        <div class="loading-text">Loading...</div>
    </div>

    <!-- Phase 3: केक स्क्रीन -->
    <div id="cake-screen" class="fullscreen" onclick="cutCake()">
        <div class="cake-emoji">🎂</div>
        <div class="tap-to-cut">Tap to cut the cake! ✨</div>
    </div>

    <!-- Phase 4: मेन वेबसाइट -->
    <div id="main-website">
        <h1>Welcome to the 3D World 🎉</h1>
        
        <!-- फोटो एल्बम (गिटहब से images/photo1.jpg लेगा) -->
        <img src="images/photo1.jpg" alt="Memory" class="album-photo" onerror="this.src='https://via.placeholder.com/300x400?text=Your+Photo+Here'">
        
        <!-- शायरी -->
        <div class="shayari-box">
            "तुम हँसते रहो, मुस्कुराते रहो,<br>
            यह दिल धड़कता रहे तुम्हारे लिए,<br>
            खुशियों की बारिश हो तुम्हारे आँगन में,<br>
            यही दुआ है हमारी तुम्हारे लिए!" 💖
        </div>

        <!-- म्यूजिक कण्ट्रोल और स्पैम बटन -->
        <button class="action-btn" onclick="toggleMusic()">🎵 Play/Pause</button>
        <button class="action-btn" onclick="spamEmojis()" style="background:#2ed573;">💥 SPAM 💥</button>
        
        <p style="margin-top: 50px; color:#888;">Scroll down for more magic... (Scratch card setup next!)</p>
    </div>

    <script>
        // --- 1. पॉप साउंड और हर टैप पर इमोजी ---
        const emojis = ['❤️', '🔥', '🎉', '🌸', '✨', '👑'];
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playPopSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        document.body.addEventListener('click', (e) => {
            playPopSound();
            const emoji = document.createElement('div');
            emoji.classList.add('tap-emoji');
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = (e.clientX - 10) + 'px';
            emoji.style.top = (e.clientY - 10) + 'px';
            document.body.appendChild(emoji);
            setTimeout(() => emoji.remove(), 1000);
        });

        // --- 2. कीपैड लॉजिक ---
        let currentPin = "";
        const correctPin = "1234";
        const display = document.getElementById("pin-display");

        function pressKey(num) {
            if(currentPin.length < 4) { currentPin += num; display.innerText = "• ".repeat(currentPin.length); }
        }
        function clearPin() { currentPin = ""; display.innerText = ""; }
        
        function checkPin() {
            if (currentPin === correctPin) {
                document.getElementById('keypad-screen').style.display = 'none';
                document.getElementById('loading-screen').style.display = 'flex';
                // 3 सेकंड लोडिंग
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('cake-screen').style.display = 'flex';
                }, 3000);
            } else {
                alert("Wrong PIN!"); clearPin();
            }
        }

        // --- 3. केक कटिंग और गाना ---
        function cutCake() {
            // गाना चलाओ
            document.getElementById('bg-music').play().catch(e => console.log("Audio play blocked", e));
            // पटाखे (Confetti) फोड़ो
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
            // केक छिपाओ, मेन वेबसाइट दिखाओ
            document.getElementById('cake-screen').style.display = 'none';
            document.getElementById('main-website').style.display = 'block';
        }

        // --- 4. स्पैम बटन और म्यूजिक कंट्रोल ---
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            if(music.paused) music.play(); else music.pause();
        }

        function spamEmojis() {
            for(let i=0; i<40; i++) {
                setTimeout(() => {
                    const spam = document.createElement('div');
                    spam.classList.add('spam-emoji');
                    spam.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    spam.style.left = Math.random() * window.innerWidth + 'px';
                    document.body.appendChild(spam);
                    setTimeout(() => spam.remove(), 2000);
                }, i * 50); // लगातार गिरते रहेंगे
            }
        }
    </script>
</body>
</html>
