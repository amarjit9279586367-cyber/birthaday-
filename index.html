<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masterpiece Lock Screen</title>
    <style>
        /* बेसिक स्टाइलिंग */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* लॉक स्क्रीन UI */
        #lock-screen {
            text-align: center;
        }

        #lock-screen h2 {
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .pin-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .pin-box {
            width: 50px;
            height: 60px;
            font-size: 28px;
            text-align: center;
            border-radius: 12px;
            border: 2px solid #444;
            background: #222;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .pin-box:focus {
            border-color: #ff4757;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        #error-msg {
            color: #ff4757;
            display: none;
            font-size: 14px;
            animation: shake 0.3s;
        }

        /* गलत पिन पर शेक एनीमेशन */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        /* लोडिंग स्क्रीन और धड़कता दिल */
        #loading-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .heart {
            font-size: 80px;
            animation: heartbeat 1s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.6));
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.3); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            letter-spacing: 3px;
            color: #ccc;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* मेन कंटेंट (जो लॉक खुलने के बाद दिखेगा) */
        #main-content {
            display: none;
            text-align: center;
        }

        #main-content h1 {
            color: #2ed573;
        }
    </style>
</head>
<body>

    <!-- लॉक स्क्रीन सेक्शन -->
    <div id="lock-screen">
        <h2>ENTER PASSCODE</h2>
        <div class="pin-container">
            <input type="password" maxlength="1" class="pin-box" id="pin1" autofocus>
            <input type="password" maxlength="1" class="pin-box" id="pin2">
            <input type="password" maxlength="1" class="pin-box" id="pin3">
            <input type="password" maxlength="1" class="pin-box" id="pin4">
        </div>
        <p id="error-msg">❌ गलत कोड! फिर से कोशिश करें।</p>
    </div>

    <!-- लोडिंग स्क्रीन (धड़कता दिल) -->
    <div id="loading-screen">
        <div class="heart">❤️</div>
        <div class="loading-text">UNLOCKING...</div>
    </div>

    <!-- मास्टर पीस कंटेंट -->
    <div id="main-content">
        <h1>🎉 मास्टर पीस अनलॉक हो गया! 🎉</h1>
        <p>यहाँ आपका थ्री.जेएस (Three.js) या जो भी फाइनल एनीमेशन है, वह आएगा।</p>
    </div>

    <script>
        const pins = document.querySelectorAll('.pin-box');
        
        // 👇 यहाँ अपना 4 डिजिट का सीक्रेट कोड सेट करें 
        const correctCode = "1234"; 
        
        pins.forEach((pin, index) => {
            // नंबर टाइप करने पर अगले बॉक्स में जाने का लॉजिक
            pin.addEventListener('input', (e) => {
                // सिर्फ नंबर्स अलाउ करें
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                
                if (e.target.value !== '') {
                    if (index < pins.length - 1) {
                        pins[index + 1].focus();
                    } else {
                        checkCode(); // चौथा डिजिट डालते ही चेक करेगा
                    }
                }
            });

            // बैकस्पेस दबाने पर पिछले बॉक्स में जाने का लॉजिक
            pin.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '') {
                    if (index > 0) {
                        pins[index - 1].focus();
                    }
                }
            });
        });

        function checkCode() {
            let enteredCode = Array.from(pins).map(p => p.value).join('');
            
            if (enteredCode === correctCode) {
                // कोड सही है - लॉक स्क्रीन छिपाएं, लोडिंग दिखाएं
                document.getElementById('error-msg').style.display = 'none';
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('loading-screen').style.display = 'flex';

                // 3 सेकंड (3000ms) तक दिल धड़केगा, फिर मेन कंटेंट दिखेगा
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                }, 3000);

            } else {
                // कोड गलत है - एरर दिखाएं और बॉक्स खाली करें
                document.getElementById('error-msg').style.display = 'block';
                pins.forEach(p => p.value = '');
                pins[0].focus();
            }
        }
    </script>
</body>
</html>
